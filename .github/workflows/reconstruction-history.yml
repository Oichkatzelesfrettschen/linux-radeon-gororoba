# Protected-base control code validates exact source commits from the PR head.
name: reconstruction-history

on:
  pull_request:
    paths:
      - "drivers/gpu/drm/radeon/**"

permissions:
  contents: read

jobs:
  history-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.history.outputs.matrix }}
    steps:
      - name: Check out trusted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out exact subject head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out pinned packaging input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oichkatzelesfrettschen/radeon-custom
          ref: 210e2b06c0266e316f08eb0b2b3e9832884c43de
          path: packaging
          fetch-depth: 1
          persist-credentials: false
          clean: true
          ssh-key: ${{ secrets.RADEON_CUSTOM_READ_DEPLOY_KEY }}

      - name: Materialize hash-verified migration input
        run: |
          python3 control/scripts/materialize_migration_input.py \
            --control-root control \
            --packaging-root packaging \
            --output "$RUNNER_TEMP/reconstruction-oracle"

      - name: Discard private-repository checkout
        if: always()
        run: |
          packaging_path="$GITHUB_WORKSPACE/packaging"
          [ "$packaging_path" = "$GITHUB_WORKSPACE/packaging" ] || exit 1
          rm -rf -- "$packaging_path"

      - name: Calibrate trusted history checker
        run: python3 control/scripts/check_reconstruction_history.py --self-test

      - name: Validate range and emit build matrix
        id: history
        run: |
          set --
          if [ "${{ github.event.pull_request.draft }}" = "false" ]; then
            set -- --require-complete
          fi
          python3 control/scripts/check_reconstruction_history.py \
            --repository subject \
            --control-root control \
            --oracle-root "$RUNNER_TEMP/reconstruction-oracle" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --prepare \
            --github-output "$GITHUB_OUTPUT" \
            "$@"

  history-build:
    needs: history-plan
    if: needs.history-plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos@sha256:2a3ec1324a76e2822f4134095942b38fded5995c73478093587ebdcd4ccf81b5
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        reconstruction_id: ${{ fromJSON(needs.history-plan.outputs.matrix) }}
    steps:
      # The container carries pacman and the CachyOS repositories, so the
      # toolchain and both kernel header trees come from the distribution the
      # module is built for. Installing before the checkouts puts git, python,
      # and ssh on PATH for them.
      - name: Install the toolchain and kernel headers
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel git python openssh clang lld llvm bc rsync curl pahole \
            linux-cachyos-lts-headers linux-cachyos-headers

      - name: Check out trusted control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
          clean: true

      - name: Check out exact subject head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: subject
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Check out pinned packaging input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: Oichkatzelesfrettschen/radeon-custom
          ref: 210e2b06c0266e316f08eb0b2b3e9832884c43de
          path: packaging
          fetch-depth: 1
          persist-credentials: false
          clean: true
          ssh-key: ${{ secrets.RADEON_CUSTOM_READ_DEPLOY_KEY }}

      - name: Materialize hash-verified migration input
        run: |
          python3 control/scripts/materialize_migration_input.py \
            --control-root control \
            --packaging-root packaging \
            --output "$RUNNER_TEMP/reconstruction-oracle"

      - name: Discard private-repository checkout
        if: always()
        run: |
          packaging_path="$GITHUB_WORKSPACE/packaging"
          [ "$packaging_path" = "$GITHUB_WORKSPACE/packaging" ] || exit 1
          rm -rf -- "$packaging_path"

      # The checkouts are owned by a different uid than the container's root,
      # and the checker reads the subject repository through git.
      - name: Trust the checkouts inside the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE/control"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/subject"

      # Each header package owns one build tree, located through the package
      # file list. Pacman repositories carry only current versions, so the
      # exact package pins under ci/kernel-build-roots cannot be satisfied
      # here; provenance comes from the image digest, pacman's signature check,
      # and the resolved release, compiler, and manifest recorded in the job
      # summary. The 6.18 lane is the LTS headers and the 7.1 lane is the
      # mainline CachyOS headers, whose release the job summary records
      # because the package tracks the current mainline kernel.
      - name: Resolve and attest the kernel build roots
        run: |
          set -eu
          resolve() {
            pacman -Qlq "$1" | sed -n 's|^\(/usr/lib/modules/[^/]*/build\)/$|\1|p' | head -1
          }
          root_6_18=$(resolve linux-cachyos-lts-headers)
          root_7_1=$(resolve linux-cachyos-headers)
          [ -d "$root_6_18" ] && [ -d "$root_7_1" ] || {
            echo "kernel build root is not installed" >&2; exit 1; }
          clang_version=$(clang --version | sed -n '1s/.*version //p')
          lld_version=$(ld.lld --version | awk 'NR == 1 { print $2 }')
          {
            printf '### history-build %s resolved inputs\n\n' "${{ matrix.reconstruction_id }}"
            printf '| field | value |\n| --- | --- |\n'
            printf '| clang | `%s` |\n' "$clang_version"
            printf '| ld.lld | `%s` |\n' "$lld_version"
          } >> "$GITHUB_STEP_SUMMARY"
          for lane in 6_18 7_1; do
            eval "root=\$root_$lane"
            release=$(basename "$(dirname "$root")")
            python3 control/scripts/check_kernel_build_root.py \
              --root "$root" \
              --emit-manifest "$RUNNER_TEMP/kernel-build-root-$lane.manifest.tsv"
            printf '| kernel release %s | `%s` |\n' "$lane" "$release" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'ROOT_6_18=%s\nROOT_7_1=%s\n' "$root_6_18" "$root_7_1" >> "$GITHUB_ENV"

      - name: Prepare immutable log path
        run: mkdir -p "$RUNNER_TEMP/logs/${{ matrix.reconstruction_id }}"

      - name: Build exact reconstruction prefix
        run: |
          python3 control/scripts/check_reconstruction_history.py \
            --repository subject \
            --control-root control \
            --oracle-root "$RUNNER_TEMP/reconstruction-oracle" \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --reconstruction-id "${{ matrix.reconstruction_id }}" \
            --root-6-18 "$ROOT_6_18" \
            --root-7-1 "$ROOT_7_1" \
            --log-root "$RUNNER_TEMP/logs/${{ matrix.reconstruction_id }}" \
            --build-timeout-seconds 900

      - name: Upload immutable commit logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: reconstruction-${{ github.event.number }}-${{ github.event.pull_request.head.sha }}-${{ matrix.reconstruction_id }}
          path: ${{ runner.temp }}/logs/${{ matrix.reconstruction_id }}
          if-no-files-found: warn
          retention-days: 30
