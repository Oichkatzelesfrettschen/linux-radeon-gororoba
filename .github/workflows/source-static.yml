# Gates that hold from the first commit, before any driver source lands.
#
# The closure declaration is only worth having if something enforces it, so the
# tracked-content checks run on every push rather than waiting for the import.
name: source-static

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Resolve whether a pull request changes anything the module-build jobs must
  # recompile. A Markdown-only change is documentation and skips those jobs;
  # every other path builds. module-build-6-18 and module-build-7-1 are
  # required ruleset contexts, and a required job skipped by a job-level
  # condition is treated as passing, so a documentation change still merges.
  # The dependent jobs read this output fail-closed: a failed or empty
  # classification builds rather than silencing the gate.
  changes:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 5
    outputs:
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          clean: true

      - name: Classify changed paths
        id: classify
        run: |
          set -eu
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "non-PR event ${{ github.event_name }}: full build"
            echo "build=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          base='${{ github.event.pull_request.base.sha }}'
          verdict=$(git diff --name-only "$base" HEAD \
            | sh scripts/classify_build_relevance.sh)
          echo "classification: $verdict"
          echo "$verdict" >>"$GITHUB_OUTPUT"

  closure:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          clean: true

      - name: No tracked generated register tables
        run: |
          if git ls-files | grep -E '_reg_safe\.h$'; then
            echo "a generated register table is tracked; the build derives these" >&2
            echo "from reg_srcs/ through mkregtable, so tracking one lets a stale" >&2
            echo "artifact outrank its source" >&2
            exit 1
          fi
          echo "no tracked generated register tables"

      - name: No tracked executables
        run: |
          # A prebuilt host program on the path the build invokes is what the
          # legacy snapshot shipped, and it is the class this repository
          # declines to carry. Scripts under scripts/ are the intended
          # exception.
          found=0
          for f in $(git ls-files); do
            case "$f" in scripts/*) continue ;; esac
            if [ -x "$f" ]; then echo "tracked executable: $f"; found=1; fi
          done
          [ "$found" -eq 0 ] || { echo "tracked executable outside scripts/" >&2; exit 1; }
          echo "no tracked executables outside scripts/"

      - name: Upstream base declaration is complete
        run: |
          for k in repository tag tag_object commit path subtree_tree; do
            grep -qE "^$k[[:space:]]*=" UPSTREAM_BASE.toml || {
              echo "UPSTREAM_BASE.toml is missing $k" >&2; exit 1; }
          done
          # A tag name is mutable, so identity rests on the two object IDs.
          grep -qE '^commit[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"' UPSTREAM_BASE.toml || {
            echo "commit must be a full 40-character object ID" >&2; exit 1; }
          grep -qE '^subtree_tree[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"' UPSTREAM_BASE.toml || {
            echo "subtree_tree must be a full 40-character object ID" >&2; exit 1; }
          echo "upstream base declaration complete"

      - name: Migration input declaration is complete
        run: |
          for k in packaging_repository packaging_commit pkgver pkgrel \
                   upstream_commit upstream_subtree base_manifest_sha256 \
                   migration_manifest_sha256 generated_output_proof_sha256 \
                   base_delta_map_sha256 patch_transitions_sha256 \
                   mechanism_map_sha256 legacy_payload_manifest_sha256; do
            grep -qE "^$k[[:space:]]*=" MIGRATION_INPUT.toml || {
              echo "MIGRATION_INPUT.toml is missing $k" >&2; exit 1; }
          done
          grep -qE '^packaging_commit[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"' MIGRATION_INPUT.toml || {
            echo "packaging_commit must be a full 40-character object ID" >&2; exit 1; }
          if grep -cE '_sha256[[:space:]]*=[[:space:]]*"[0-9a-f]{64}"' MIGRATION_INPUT.toml | grep -qx 7; then
            echo "migration input declaration complete"
          else
            echo "every *_sha256 value must be a full 64-character hash" >&2; exit 1
          fi

      - name: Migration input matches the upstream base
        run: |
          # The pin repeats the upstream identity so a reconstruction commit
          # is self-describing; the two declarations must agree.
          for k in commit subtree_tree; do
            base=$(grep -m1 -E "^$k[[:space:]]*=" UPSTREAM_BASE.toml | grep -oE '[0-9a-f]{40}')
            case "$k" in
              commit) pin=$(grep -E '^upstream_commit' MIGRATION_INPUT.toml | grep -oE '[0-9a-f]{40}') ;;
              subtree_tree) pin=$(grep -E '^upstream_subtree' MIGRATION_INPUT.toml | grep -oE '[0-9a-f]{40}') ;;
            esac
            [ "$base" = "$pin" ] || {
              echo "MIGRATION_INPUT.toml upstream $k disagrees with UPSTREAM_BASE.toml" >&2
              exit 1; }
          done
          echo "migration input agrees with the upstream base declaration"

      - name: No hardware verdict language
        run: |
          # Hardware verdicts live in steinmarder-r300. A source repository
          # claiming one would create a second home for the same fact.
          if git ls-files '*.md' | xargs grep -nE 'hardware-pass|hardware-run' 2>/dev/null; then
            echo "hardware verdict language belongs in steinmarder-r300" >&2
            exit 1
          fi
          echo "no hardware verdict language"

      - name: Source closure declarations are proven
        run: python3 scripts/check_source_closure.py

      - name: Source equivalence attestation is proven
        run: python3 scripts/check_source_equivalence_attestation.py

  module-build-6-18:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: radeon.ko builds from the tracked subtree
        env:
          KERNEL_BUILD_ROOT: ${{ vars.RADEON_MODULE_KERNEL_BUILD_ROOT_618 }}
        run: |
          [ -n "$KERNEL_BUILD_ROOT" ] || {
            echo "RADEON_MODULE_KERNEL_BUILD_ROOT_618 is unset" >&2; exit 1; }
          python3 scripts/check_kernel_build_root.py \
            --root "$KERNEL_BUILD_ROOT" \
            --declaration ci/kernel-build-roots/6.18.38-2-cachyos-lts.toml \
            --manifest ci/kernel-build-roots/6.18.38-2-cachyos-lts.manifest.tsv
          timeout 300 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh --self-test
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --prod \
              --kernel-build-root "$KERNEL_BUILD_ROOT"
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --all-dev \
              --kernel-build-root "$KERNEL_BUILD_ROOT"

  module-build-7-1:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.build != 'false' }}
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true
      - name: radeon.ko builds from the tracked subtree
        env:
          KERNEL_BUILD_ROOT: ${{ vars.RADEON_MODULE_KERNEL_BUILD_ROOT_71 }}
        run: |
          [ -n "$KERNEL_BUILD_ROOT" ] || {
            echo "RADEON_MODULE_KERNEL_BUILD_ROOT_71 is unset" >&2
            exit 1
          }
          python3 scripts/check_kernel_build_root.py \
            --root "$KERNEL_BUILD_ROOT" \
            --declaration ci/kernel-build-roots/7.1.4-1-cachyos.toml \
            --manifest ci/kernel-build-roots/7.1.4-1-cachyos.manifest.tsv
          timeout 300 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh --self-test
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --prod \
              --kernel-build-root "$KERNEL_BUILD_ROOT"
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --observe-dev \
              --kernel-build-root "$KERNEL_BUILD_ROOT"
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --probe-dev \
              --kernel-build-root "$KERNEL_BUILD_ROOT"
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --mutate-dev \
              --kernel-build-root "$KERNEL_BUILD_ROOT"
          timeout 1800 flock "$HOME/.cache/gororoba-ci/radeon-build.lock" \
            sh scripts/build_radeon_module.sh \
              --all-dev \
              --kernel-build-root "$KERNEL_BUILD_ROOT"

  lint:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
          clean: true
      - name: shellcheck
        run: shellcheck -S error scripts/*.sh
      - name: ruff
        run: ruff check scripts/
      - name: build-relevance classifier calibration
        run: sh scripts/classify_build_relevance.sh --self-test
      - name: retained kernel root calibration
        run: python3 scripts/check_kernel_build_root.py --self-test
      - name: source manifest calibration
        run: python3 scripts/manifest_source_tree.py --self-test
      - name: source closure calibration
        run: python3 scripts/check_source_closure.py --self-test
      - name: source equivalence attestation calibration
        run: python3 scripts/check_source_equivalence_attestation.py --self-test
      - name: reconstruction plan calibration
        run: python3 scripts/check_reconstruction_plan.py --self-test
      - name: reconstruction plan
        run: python3 scripts/check_reconstruction_plan.py
      - name: source delta map calibration
        run: python3 scripts/check_source_delta_map.py --self-test
      - name: source delta map
        run: python3 scripts/check_source_delta_map.py
      - name: build feature policy calibration
        run: python3 scripts/check_build_features.py --self-test
      - name: build feature policy
        run: python3 scripts/check_build_features.py
      - name: all-dev interface calibration
        run: python3 scripts/check_all_dev_interfaces.py --self-test
      - name: all-dev interface inventory
        run: python3 scripts/check_all_dev_interfaces.py
      - name: parked admission guard calibration
        run: python3 scripts/check_parked_admission_guards.py --selftest
      - name: parked admission guards
        run: python3 scripts/check_parked_admission_guards.py
      - name: parked entry policy calibration
        run: python3 scripts/check_parked_entry_policy.py --selftest
      - name: parked entry policy
        run: python3 scripts/check_parked_entry_policy.py
      - name: RS4xx GART cache policy calibration
        run: python3 scripts/check_rs4xx_gart_cache_policy.py --selftest
      - name: RS4xx GART cache policy
        run: python3 scripts/check_rs4xx_gart_cache_policy.py
      - name: legacy patch denominator calibration
        run: python3 scripts/check_legacy_patch_denominator.py --selftest
      - name: legacy patch denominator
        run: python3 scripts/check_legacy_patch_denominator.py
      - name: reconstruction prefix calibration
        run: python3 scripts/materialize_reconstruction_prefixes.py --self-test
      - name: reconstruction prefixes
        run: python3 scripts/materialize_reconstruction_prefixes.py
      - name: migration input calibration
        run: python3 scripts/materialize_migration_input.py --self-test
      - name: reconstruction history calibration
        run: python3 scripts/check_reconstruction_history.py --self-test
      - name: generated register output calibration
        run: python3 scripts/check_generated_register_outputs.py --self-test
      - name: CS-grammar correspondence
        run: sh scripts/run_r300_cs_grammar_correspondence.sh "${RUNNER_TEMP}/correspondence"
      - name: CS run-form mutant calibration
        run: sh scripts/run_r300_cs_runform_calibration.sh "${RUNNER_TEMP}/runform-calibration"

      - name: importer calibration
        run: |
          # A verdict-producing importer earns trust by rejecting each way a
          # declaration can be wrong before its successful import is believed.
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/import.XXXXXX")
          trap 'rm -rf "$work"; git checkout -- UPSTREAM_BASE.toml' EXIT
          remote=https://github.com/torvalds/linux

          expect() {
            want=$1 label=$2 dest=$3
            set +e
            sh scripts/import-upstream-radeon.sh --out "$dest" --remote "$remote" \
              >"$work/out.log" 2>&1
            rc=$?
            set -e
            git checkout -- UPSTREAM_BASE.toml
            [ "$rc" -eq "$want" ] || {
              echo "$label: expected exit $want, got $rc" >&2
              sed 's/^/    /' "$work/out.log" >&2
              exit 1; }
            echo "  ok: $label exits $rc"
          }

          mkdir -p "$work/nonempty" && : > "$work/nonempty/residual.c"
          expect 2 "nonempty destination" "$work/nonempty"

          sed -i 's/^tag_object = "[0-9a-f]\{40\}"/tag_object = "1111111111111111111111111111111111111111"/' UPSTREAM_BASE.toml
          expect 3 "wrong tag object" "$work/d1"

          sed -i 's/^commit = "[0-9a-f]\{40\}"/commit = "2222222222222222222222222222222222222222"/' UPSTREAM_BASE.toml
          expect 3 "wrong peeled commit" "$work/d2"

          sed -i 's/^subtree_tree = "[0-9a-f]\{40\}"/subtree_tree = "0000000000000000000000000000000000000000"/' UPSTREAM_BASE.toml
          expect 3 "wrong subtree tree" "$work/d3"

          # Known good, last. The import is compared against the committed
          # pristine manifest rather than the tracked subtree: the manifest is
          # keyed to UPSTREAM_BASE.toml and stays constant, while the tracked
          # tree diverges from pristine the moment driver work lands on it.
          sh scripts/import-upstream-radeon.sh --out "$work/good" --remote "$remote"
          python3 scripts/manifest_source_tree.py --tree "$work/good" --root . \
            --out "$work/imported.tsv"
          python3 scripts/manifest_source_tree.py --compare "$work/imported.tsv" \
            docs/upstream-pristine-manifest.tsv
          echo "  ok: declared import matches the committed pristine manifest"
