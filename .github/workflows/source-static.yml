# Gates that hold from the first commit, before any driver source lands.
#
# The closure declaration is only worth having if something enforces it, so the
# tracked-content checks run on every push rather than waiting for the import.
name: source-static

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  closure:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true

      - name: No tracked generated register tables
        run: |
          if git ls-files | grep -E '_reg_safe\.h$'; then
            echo "a generated register table is tracked; the build derives these" >&2
            echo "from reg_srcs/ through mkregtable, so tracking one lets a stale" >&2
            echo "artifact outrank its source" >&2
            exit 1
          fi
          echo "no tracked generated register tables"

      - name: No tracked executables
        run: |
          # A prebuilt host program on the path the build invokes is what the
          # legacy snapshot shipped, and it is the class this repository
          # declines to carry. Scripts under scripts/ are the intended
          # exception.
          found=0
          for f in $(git ls-files); do
            case "$f" in scripts/*) continue ;; esac
            if [ -x "$f" ]; then echo "tracked executable: $f"; found=1; fi
          done
          [ "$found" -eq 0 ] || { echo "tracked executable outside scripts/" >&2; exit 1; }
          echo "no tracked executables outside scripts/"

      - name: Upstream base declaration is complete
        run: |
          for k in repository tag tag_object commit path subtree_tree; do
            grep -qE "^$k[[:space:]]*=" UPSTREAM_BASE.toml || {
              echo "UPSTREAM_BASE.toml is missing $k" >&2; exit 1; }
          done
          # A tag name is mutable, so identity rests on the two object IDs.
          grep -qE '^commit[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"' UPSTREAM_BASE.toml || {
            echo "commit must be a full 40-character object ID" >&2; exit 1; }
          grep -qE '^subtree_tree[[:space:]]*=[[:space:]]*"[0-9a-f]{40}"' UPSTREAM_BASE.toml || {
            echo "subtree_tree must be a full 40-character object ID" >&2; exit 1; }
          echo "upstream base declaration complete"

      - name: No hardware verdict language
        run: |
          # Hardware verdicts live in steinmarder-r300. A source repository
          # claiming one would create a second home for the same fact.
          if git ls-files '*.md' | xargs grep -nE 'hardware-pass|hardware-run' 2>/dev/null; then
            echo "hardware verdict language belongs in steinmarder-r300" >&2
            exit 1
          fi
          echo "no hardware verdict language"

  lint:
    runs-on: [self-hosted, linux, cachyos, workstation-host]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          clean: true
      - name: shellcheck
        run: shellcheck -S error scripts/*.sh
      - name: ruff
        run: ruff check scripts/
      - name: source manifest calibration
        run: python3 scripts/manifest_source_tree.py --self-test

      - name: importer calibration
        run: |
          # A verdict-producing importer earns trust by rejecting each way a
          # declaration can be wrong before its successful import is believed.
          work=$(mktemp -d "${RUNNER_TEMP:-/tmp}/import.XXXXXX")
          trap 'rm -rf "$work"; git checkout -- UPSTREAM_BASE.toml' EXIT
          remote=https://github.com/torvalds/linux

          expect() {
            want=$1 label=$2 dest=$3
            set +e
            sh scripts/import-upstream-radeon.sh --out "$dest" --remote "$remote" \
              >"$work/out.log" 2>&1
            rc=$?
            set -e
            git checkout -- UPSTREAM_BASE.toml
            [ "$rc" -eq "$want" ] || {
              echo "$label: expected exit $want, got $rc" >&2
              sed 's/^/    /' "$work/out.log" >&2
              exit 1; }
            echo "  ok: $label exits $rc"
          }

          mkdir -p "$work/nonempty" && : > "$work/nonempty/residual.c"
          expect 2 "nonempty destination" "$work/nonempty"

          sed -i 's/^tag_object = "[0-9a-f]\{40\}"/tag_object = "1111111111111111111111111111111111111111"/' UPSTREAM_BASE.toml
          expect 3 "wrong tag object" "$work/d1"

          sed -i 's/^commit = "[0-9a-f]\{40\}"/commit = "2222222222222222222222222222222222222222"/' UPSTREAM_BASE.toml
          expect 3 "wrong peeled commit" "$work/d2"

          sed -i 's/^subtree_tree = "[0-9a-f]\{40\}"/subtree_tree = "0000000000000000000000000000000000000000"/' UPSTREAM_BASE.toml
          expect 3 "wrong subtree tree" "$work/d3"

          # Known good, last: the declaration must import and match what the
          # repository already carries.
          sh scripts/import-upstream-radeon.sh --out "$work/good" --remote "$remote"
          n=$(find "$work/good" -type f | wc -l)
          [ "$n" -eq 213 ] || { echo "imported $n files, expected 213" >&2; exit 1; }
          python3 scripts/manifest_source_tree.py --tree "$work/good" --root . \
            --out "$work/imported.tsv"
          python3 scripts/manifest_source_tree.py --tree drivers/gpu/drm/radeon --root . \
            --out "$work/tracked.tsv"
          python3 scripts/manifest_source_tree.py --compare "$work/imported.tsv" "$work/tracked.tsv"
          echo "  ok: declared import matches the tracked driver subtree"
