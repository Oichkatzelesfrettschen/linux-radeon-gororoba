schema = 1

# Profile tier and operation arming are independent axes. A feature is
# classified by the maximum hardware side effect in its executable path.

[[feature]]
id = "mc-flush"
setting = "mc-flush-dev"
tier = "mutate-dev"
availability_default = "absent-in-prod"
runtime_profile_default = "off"
operation_arm_default = "unarmed"
arming_model = "explicit-root-write"
side_effect_class = "command-submission"

