schema = 1

[profile_model]
ordered = ["prod", "observe-dev", "probe-dev", "mutate-dev"]
build_alias = "all-dev"
build_alias_resolves_to = "mutate-dev"
runtime_default = "off"
runtime_allowed = ["off", "observe-dev", "probe-dev", "mutate-dev"]

# Runtime dependencies describe the post-tag build projection. Reconstruction
# ordering and evidence dependencies remain separate because neither licenses
# a production feature to link a development-only implementation.

[[feature]]
id = "kernel-compatibility"
setting = "prod"
tier = "prod"
source_objects = [
  "drivers/gpu/drm/radeon/radeon.h",
  "drivers/gpu/drm/radeon/pptable.h",
  "drivers/gpu/drm/radeon/atombios_crtc.c",
  "drivers/gpu/drm/radeon/radeon_legacy_crtc.c",
  "drivers/gpu/drm/radeon/radeon_mode.h",
  "drivers/gpu/drm/radeon/radeon_device.c",
  "drivers/gpu/drm/radeon/radeon_fbdev.c",
  "drivers/gpu/drm/radeon/radeon_gem.c",
  "drivers/gpu/drm/radeon/radeon_irq_kms.c",
  "drivers/gpu/drm/radeon/radeon_ttm.c",
]
source_mechanisms = ["B01", "B02", "B03", "B04", "B05", "B06", "B07", "B08", "B09"]
dependencies = []
evidence_dependencies = []
runtime_profile = "prod"
operation_gate = "kernel version and callback signature selected at compile time"
availability_default = "present-in-prod"
runtime_profile_default = "active"
operation_arm_default = "active"
arming_model = "compile-time-version-selection"
privilege = "kernel-internal"
execution_scope = "supported external-module kernel lanes"
evidence_scope = "retained 6.18 and 7.1 module-build roots"
scope_refs = []
scope_relation = "equal"
scope_decision = "both declared kernel lanes are build requirements after B09"
side_effect_class = "software-state"
interface_class = "build"
resource_bounds = "one compile-time API branch per guarded call site"
locking = "unchanged subsystem locking"
error_contract = "compiler or modpost failure rejects the build"
tests = [
  "normal: retained 6.18 module build",
  "boundary: retained 7.1 module build",
  "failure: unsupported declaration rejects before compilation",
  "adversarial: contradictory compatibility branch fails warnings-as-errors",
]
production_promotion_condition = "already production compatibility"
profile_exception = "none"
exception_basis = "none"
package_projection = "production"
rollback = "revert the individual compatibility mechanism"

