schema = 1
repository = "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"

[contract]
enable_failure_counter = "pci_enable_device_flags decrements enable_cnt when do_pci_enable_device fails"
disable_precondition = "pci_disable_device consumes one successful enable reference"
restored_bus_master = "pci_restore_state can restore PCI_COMMAND_MASTER before pci_enable_device returns"
retry_state = "pci_save_state records the cleared command register before a later runtime-resume retry"
runtime_retry = "runtime PM returns a failed resume callback to suspended state and permits a later callback"
d3cold_policy = "an ATPX hybrid enters PCI_D3cold"
d3hot_policy = "a device without ATPX discrete-GPU power control enters PCI_D3hot"
terminal_ownership = "terminal RS4xx retention preserves PCI configuration and power state until reboot"

