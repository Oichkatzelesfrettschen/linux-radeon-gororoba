# Where the instrument's own files sit inside the producer repository. A sealed
# bundle records this layout, so a verifier reconstructs the retained producer
# denominator from the bundle rather than from the constants of whichever
# instrument runs the verification.
[producer]
agents_path = "AGENTS.md"
script_path = "scripts/capture_radeon_driver_source_map.py"
policy_path = "policy/radeon-driver-source-map.toml"
admission_contract_path = "scripts/check_rs4xx_hardware_admission_contract.py"

[tool.gnu_global]
version = "6.6.15"
config_sha256 = "81dde334ac51322be8d407771aca03f9e2b61d8fbd3bd0713ce134033c38db67"

[tool.cflow]
allowed_stderr_patterns = [
  '^(?:.*/)?cflow:[^:]+:[1-9][0-9]*: [A-Za-z_][A-Za-z0-9_]*(?:/[1-9][0-9]*)? redefined$',
