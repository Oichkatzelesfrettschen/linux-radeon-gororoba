schema = 1
capture_schema = "gororoba-radeon-driver-source-map-v1"
comparison_schema = "gororoba-radeon-driver-source-map-comparison-v1"
source_root = "drivers/gpu/drm/radeon"
max_source_files = 256
max_source_bytes = 7000000

required_tools = [
  "bwrap",
  "git",
  "cflow",
  "cscope",
  "ctags",
  "readtags",
  "gtags",
  "global",
  "lizard",
  "scc",
  "dot",
  "python3",
]

optional_tools = [
  "clang",
  "gcc",
  "sparse",
  "semgrep",
  "weggli",
  "spatch",
  "doxygen",
  "tree-sitter",
]

[tool.gnu_global]
version = "6.6.15"
config_sha256 = "81dde334ac51322be8d407771aca03f9e2b61d8fbd3bd0713ce134033c38db67"

[tool.cflow]
allowed_stderr_patterns = [
  '^(?:.*/)?cflow:[^:]+:[1-9][0-9]*: [A-Za-z_][A-Za-z0-9_]*(?:/[1-9][0-9]*)? redefined$',
  '^(?:.*/)?cflow:[^:]+:[1-9][0-9]*: this is the place of previous definition$',
]

[tool.ctags]
allowed_stderr_patterns = [
  '^ctags: Notice: No options will be read from files or environment$',
  '^ctags: Warning: Enabling Cargo subparser may enable TOML parser\.$',
  '^ctags: Warning: The current implementation of the TOML parser is broken\.$',
]

[source_classes]
c = "*.c"
header = "*.h"
register_policy = "reg_srcs/*"
makefile = "Makefile"
kconfig = "Kconfig"

[callback_extractor]
minimum_field_initializers = 300
minimum_define_show_attributes = 20
minimum_drm_ioctl_bindings = 10
minimum_work_bindings = 5

[preprocessor]
translation_units = [
  "drivers/gpu/drm/radeon/radeon_drv.c",
  "drivers/gpu/drm/radeon/radeon_kms.c",
  "drivers/gpu/drm/radeon/radeon_device.c",
  "drivers/gpu/drm/radeon/radeon_asic.c",
  "drivers/gpu/drm/radeon/radeon_cs.c",
  "drivers/gpu/drm/radeon/radeon_gem.c",
  "drivers/gpu/drm/radeon/radeon_prime.c",
  "drivers/gpu/drm/radeon/radeon_ttm.c",
  "drivers/gpu/drm/radeon/radeon_gart.c",
  "drivers/gpu/drm/radeon/radeon_irq_kms.c",
  "drivers/gpu/drm/radeon/radeon_display.c",
  "drivers/gpu/drm/radeon/radeon_connectors.c",
  "drivers/gpu/drm/radeon/radeon_fbdev.c",
  "drivers/gpu/drm/radeon/radeon_fence.c",
  "drivers/gpu/drm/radeon/radeon_ib.c",
  "drivers/gpu/drm/radeon/r100.c",
  "drivers/gpu/drm/radeon/r300.c",
  "drivers/gpu/drm/radeon/rs400.c",
  "drivers/gpu/drm/radeon/radeon_rs4xx_dev.c",
  "drivers/gpu/drm/radeon/radeon_evergreen_dev.c",
  "drivers/gpu/drm/radeon/evergreen.c",
]

[[preprocessor.kernel]]
release = "6.18.38-2-cachyos-lts"
declaration = "ci/kernel-build-roots/6.18.38-2-cachyos-lts.toml"
manifest = "ci/kernel-build-roots/6.18.38-2-cachyos-lts.manifest.tsv"
profiles = ["prod", "mutate-dev"]

[[preprocessor.kernel]]
release = "7.1.4-1-cachyos"
declaration = "ci/kernel-build-roots/7.1.4-1-cachyos.toml"
manifest = "ci/kernel-build-roots/7.1.4-1-cachyos.manifest.tsv"
profiles = ["prod", "observe-dev", "probe-dev", "mutate-dev"]

[[partition]]
name = "module-lifecycle"
roots = [
  "radeon_module_init",
  "radeon_pci_probe",
  "radeon_driver_load_kms",
  "radeon_device_init",
  "radeon_driver_unload_kms",
  "radeon_module_exit",
]
falsifier = "A preprocessed or Linux core graph that resolves PCI unregister teardown without a declared external binding invalidates the recorded lexical stop line."

[[partition]]
name = "profile-and-admission"
roots = [
  "radeon_dev_profile_set",
  "radeon_dev_hardware_available",
  "radeon_gem_object_create",
  "radeon_gem_prime_import_sg_table",
  "radeon_mode_dumb_create",
]
falsifier = "A framework callback that reaches a hardware path without a recorded admission edge invalidates the partition boundary."

[[partition]]
name = "kms-and-debugfs"
roots = [
  "radeon_dev_debugfs_register",
  "radeon_rs480_re_debugfs_register",
  "radeon_evergreen_dev_debugfs_register",
  "radeon_force_pci_reset_safe_write",
]
falsifier = "A preprocessed callback table or debugfs file operation that resolves to another target invalidates the declared binding."

[[partition]]
name = "command-submission"
roots = [
  "radeon_cs_ioctl",
  "radeon_cs_parser_init",
  "radeon_cs_ib_chunk",
  "r300_cs_parse",
  "r300_packet0_check",
  "r100_cs_parse_packet0",
]
falsifier = "A changed link in the RS480 ASIC ring, parser callback, or packet zero checker chain invalidates the partition."

[[partition]]
name = "gart-and-memory"
roots = [
  "radeon_ttm_init",
  "radeon_gart_init",
  "rs400_gart_init",
  "rs400_gart_enable",
  "rs400_gart_set_page",
  "rs400_gart_tlb_flush",
]
falsifier = "A preprocessed GART wrapper without a valid caller local rdev or a changed RS400 GART initializer invalidates the inferred edge."

[[partition]]
name = "reset-and-park"
roots = [
  "radeon_gpu_reset",
  "radeon_gpu_reset_forced",
  "radeon_gpu_reset_internal",
  "r300_asic_reset",
  "rs400_resume",
  "radeon_fence_check_lockup",
  "radeon_flip_work_func",
  "rs480_reset_hang_probe_show",
  "rs480_wedged_3d_reset",
  "evergreen_gpu_pci_config_reset_safe",
]
falsifier = "A changed detected or forced reset wrapper, writer-lock owner, post-reset status lock, ASIC reset target, work callback, or Palm file operation invalidates the reset path."

[[partition]]
name = "register-policy-generation"
roots = [
  "main",
  "parser_auth",
  "table_build",
  "r300_set_reg_safe",
  "rs480_set_reg_safe",
  "radeon_rs4xx_dev_apply_r400_us_reg_safe",
]
falsifier = "A generated register bitmap that does not derive from the admitted reg_srcs input invalidates the source graph."

