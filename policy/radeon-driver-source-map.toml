[[bounded_query]]
name = "legacy-palm-debugfs-init-symbol"
paths = ["drivers/gpu/drm/radeon/*.c", "drivers/gpu/drm/radeon/*.h"]
pattern = '\bradeon_evergreen_dev_debugfs_init\b'
rationale = "The pre-merge global debugfs registration symbol disappears from the corrected source."

[[bounded_query]]
name = "pci-remove-callback"
paths = ["drivers/gpu/drm/radeon/radeon_drv.c"]
pattern = '\.remove\s*='
rationale = "The admitted PCI driver table carries no explicit remove callback."

[[bounded_query]]
name = "global-debugfs-parent"
paths = ["drivers/gpu/drm/radeon/*.c"]
pattern = 'debugfs_create_file\([^;]*,\s*NULL\s*,'
rationale = "A NULL debugfs parent creates a global lifetime outside a DRM minor tree."

[[bounded_query]]
name = "gpu-reset-entry-symbol-occurrences"
paths = ["drivers/gpu/drm/radeon/*.c"]
pattern = '\bradeon_gpu_reset(?:_forced|_internal)?\s*\('
rationale = "Every detected, forced, and internal reset entry occurrence remains visible even when a narrow root list omits a callback path."
