schema = 1
repository = "https://git.kernel.org/pub/scm/linux/kernel/git/torvalds/linux.git"

[contract]
unpopulate_callback_return = "void"
unpopulate_core_successor = [
  "subtract nonexternal pages from the global TTM allocation counters",
  "clear TTM_TT_FLAG_PRIV_POPULATED",
]
bo_cleanup_successor = [
  "destroy the translation table",
  "free the resource-manager range",
]
bo_release_successor = "invoke the driver destroy callback after generic cleanup"
gem_release_successor = "invoke the GEM free callback after the final GEM reference"
resource_free_successor = "release the manager range and clear the BO resource pointer"
prime_destroy_successor = "unmap and detach the imported SG attachment"
external_pages = "exclude pages from global TTM allocation accounting"
agp_translation_storage = "struct page pointer array"
radeon_gart_translation_storage = "DMA address array"
agp_imported_sg = "reject before TTM construction because the AGP backend consumes a struct page pointer array rather than the Radeon GART DMA-address array"
terminal_transfer = "retain the complete Radeon BO and TTM table before the void callback returns, then count pages that leave global TTM accounting"
terminal_resource_range = "generic TTM frees the range after retention, so closed hardware admission forbids every later allocation and move"

